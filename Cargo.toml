[package]
name = "monkeytype-tui"
version = "0.1.0"
edition = "2024"
# Edition 2024 + let-chains (used in main.rs / words.rs) require Rust 1.88+.
rust-version = "1.88"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
unicode-width = "0.2"

# Mirror CI's clippy strictness locally so `cargo clippy` matches the pipeline.
[lints.clippy]
all = { level = "deny", priority = -1 }
